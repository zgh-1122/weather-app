<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraWeather Pro ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      cursor: none;
    }

    body {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
      transition: background-image 0.8s ease;
      background-color: #1a1a2e;
    }

    /* Background Overlay */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.22);
      z-index: 1;
      pointer-events: none;
    }

    /* Custom Cursor */
    #customCursor {
      position: fixed;
      width: 16px;
      height: 16px;
      background: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      transition: transform 0.1s ease-out, width 0.2s ease, height 0.2s ease;
    }

    #customCursorFollower {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease-out;
    }

    /* Responsive Weather Card */
    .weather-card {
      position: relative;
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 24px 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      color: #ffffff;
      z-index: 2;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .app-branding {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .live-badge {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Search Box */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .search-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.28);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      padding: 10px 16px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: 0.3s;
      min-width: 0;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.8);
      background: rgba(0, 0, 0, 0.45);
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      padding: 0 16px;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.55);
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    /* Main Display Box */
    .main-display {
      background: rgba(0, 0, 0, 0.22);
      border-radius: 20px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .city-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .date-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .hero-weather-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
    }

    .temp-large {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .weather-emoji {
      font-size: 44px;
      animation: floatEmoji 3s ease-in-out infinite alternate;
    }

    @keyframes floatEmoji {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    .condition-text {
      font-size: 13px;
      font-weight: 700;
      color: #ffd166;
    }

    /* Highlights Column */
    .highlights-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .highlight-card {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hl-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 700;
      text-transform: uppercase;
    }

    .hl-val {
      font-size: 14px;
      font-weight: 800;
    }

    /* Forecast Line Graph */
    .section-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
    }

    .graph-container {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 14px 10px 8px 10px;
      overflow-x: auto;
    }

    .graph-wrapper {
      position: relative;
      min-width: 550px;
      height: 130px;
    }

    svg.temp-graph {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .graph-day-label {
      fill: rgba(255, 255, 255, 0.85);
      font-size: 11px;
      font-weight: 700;
      text-anchor: middle;
    }

    .graph-temp-label {
      fill: #ffd166;
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
    }

    .graph-emoji {
      font-size: 16px;
      text-anchor: middle;
    }

    /* Offline Glass Card Overlay */
    .offline-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 28px;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .offline-modal.active {
      display: flex;
    }

    .offline-icon {
      font-size: 48px;
      margin-bottom: 12px;
      animation: pulseAlert 2s infinite alternate;
    }

    @keyframes pulseAlert {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .offline-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .offline-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 280px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .retry-btn {
      background: linear-gradient(135deg, #ffd166, #ff758c);
      border: none;
      color: #1a1a2e;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 209, 102, 0.4);
      transition: 0.2s;
    }

    .retry-btn:hover {
      transform: scale(1.05);
    }

    /* Shimmer Skeleton Loader */
    .skeleton-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      z-index: 90;
      justify-content: center;
      align-items: center;
      color: #ffd166;
      font-weight: 700;
      font-size: 14px;
    }

    .skeleton-overlay.active {
      display: flex;
    }

    /* Media Queries for Mobile Responsiveness */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .weather-card {
        padding: 18px 16px;
        border-radius: 22px;
      }
      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .city-name {
        font-size: 20px;
      }
      .temp-large {
        font-size: 38px;
      }
      .weather-emoji {
        font-size: 38px;
      }
      .action-btn {
        padding: 0 12px;
        font-size: 12px;
      }
      .search-input {
        padding: 9px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>
  <div id="customCursor"></div>
  <div id="customCursorFollower"></div>

  <div class="weather-card">
    <!-- Offline Alert State Screen -->
    <div class="offline-modal" id="offlineModal">
      <div class="offline-icon">📡</div>
      <div class="offline-title">No Internet Connection</div>
      <div class="offline-sub">Please check your network settings and try again to load live weather updates.</div>
      <button class="retry-btn" onclick="retryConnection()">Try Again 🔄</button>
    </div>

    <!-- Skeleton Shimmer Loader -->
    <div class="skeleton-overlay" id="skeletonLoader">
      ✨ Loading live weather vibes...
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="app-branding">AuraWeather ✨</div>
      <div class="live-badge">Live API Active</div>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
      <input type="text" id="cityInput" class="search-input" placeholder="Search city (e.g., Dubai, London, Singapore)..." />
      <button class="action-btn" onclick="fetchWeatherBySearch()">Search</button>
      <button class="action-btn" onclick="fetchWeatherByLocation()" title="My Location">📍</button>
    </div>

    <div id="weatherContent">
      <div class="dashboard-grid">
        <!-- Left Hero Card -->
        <div class="main-display">
          <div>
            <div class="city-name" id="cityName">Gujrat, PK</div>
            <div class="date-text" id="currentDate">Sunday, Nov 8</div>
          </div>
          <div class="hero-weather-info">
            <div class="temp-large" id="tempDegree">27°C</div>
            <div class="weather-emoji" id="weatherEmoji">☀️</div>
          </div>
          <div class="condition-text" id="weatherDesc">Sunny & Bright</div>
        </div>

        <!-- Right Highlights Column -->
        <div class="highlights-column">
          <div class="highlight-card">
            <span class="hl-label">Humidity</span>
            <span class="hl-val" id="humidityVal">45%</span>
          </div>
          <div class="highlight-card">
            <span class="hl-label">Wind Speed</span>
            <span class="hl-val" id="windVal">12 km/h</span>
          </div>
          <div class="highlight-card">
            <span class="hl-label">Air Pressure</span>
            <span class="hl-val" id="pressureVal">1014 hPa</span>
          </div>
        </div>
      </div>

      <!-- 7-Day Line Graph Forecast -->
      <div class="section-title">7-Day Temperature Trend</div>
      <div class="graph-container">
        <div class="graph-wrapper">
          <svg class="temp-graph" id="tempGraphSVG" viewBox="0 0 550 130">
            <!-- Line Graph Rendered via JS -->
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cursor = document.getElementById('customCursor');
    const follower = document.getElementById('customCursorFollower');

    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
      follower.style.left = e.clientX + 'px';
      follower.style.top = e.clientY + 'px';
    });

    const options = { weekday: 'long', month: 'short', day: 'numeric' };
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', options);

    function getWeatherDetails(code) {
      if (code === 0) {
        return { 
          desc: 'Sunny & Clear', 
          emoji: '☀️', 
          bg: "url('https://tse3.mm.bing.net/th/id/OIP.KfWrpxYlyG4dah-Vn6_iTwHaEJ?r=0&pid=Api&h=220&P=0')" 
        };
      }
      if ([1, 2, 3, 45, 48].includes(code)) {
        return { 
          desc: 'Cloudy / Overcast', 
          emoji: '☁️', 
          bg: "url('https://tse1.mm.bing.net/th/id/OIP.v1UNQiMfVYT9MFca0AbGmgHaE8?r=0&pid=Api&h=220&P=0')" 
        };
      }
      if ([51, 53, 55, 61, 63, 65, 80, 81, 95].includes(code)) {
        return { 
          desc: 'Rainy Atmosphere', 
          emoji: '🌧️', 
          bg: "url('https://tse1.mm.bing.net/th/id/OIP.C6pIT9gJ8wb3gxrdWMF4wwHaE7?r=0&pid=Api&h=220&P=0')" 
        };
      }
      return { 
        desc: 'Clouds & Sunshine', 
        emoji: '🌥️', 
        bg: "url('https://tse2.mm.bing.net/th/id/OIP.SfhSlpd3h3HfDUfAaZ2GNQHaE8?r=0&pid=Api&h=220&P=0')" 
      };
    }

    function renderLineGraph(daysData) {
      const svg = document.getElementById('tempGraphSVG');
      svg.innerHTML = '';

      const temps = daysData.map(d => d.maxTemp);
      const minTemp = Math.min(...temps) - 2;
      const maxTemp = Math.max(...temps) + 2;

      const width = 550;
      const height = 130;
      const paddingX = 40;
      const stepX = (width - paddingX * 2) / 6;

      const points = daysData.map((d, i) => {
        const x = paddingX + i * stepX;
        const normalized = (d.maxTemp - minTemp) / (maxTemp - minTemp || 1);
        const y = height - 30 - (normalized * (height - 65));
        return { x, y, day: d.day, temp: d.maxTemp, emoji: d.emoji };
      });

      let pathD = `M ${points[0].x} ${points[0].y}`;
      for (let i = 1; i < points.length; i++) {
        const cx = (points[i - 1].x + points[i].x) / 2;
        pathD += ` C ${cx} ${points[i - 1].y}, ${cx} ${points[i].y}, ${points[i].x} ${points[i].y}`;
      }

      let areaD = `${pathD} L ${points[points.length - 1].x} ${height - 10} L ${points[0].x} ${height - 10} Z`;

      let svgContent = `
        <defs>
          <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffd166" />
            <stop offset="100%" stop-color="#ff758c" />
          </linearGradient>
          <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="rgba(255, 209, 102, 0.35)" />
            <stop offset="100%" stop-color="rgba(255, 209, 102, 0.0)" />
          </linearGradient>
        </defs>

        <path d="${areaD}" fill="url(#areaGrad)" />
        <path d="${pathD}" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />
      `;

      points.forEach(p => {
        svgContent += `
          <text x="${p.x}" y="14" class="graph-day-label">${p.day}</text>
          <text x="${p.x}" y="32" class="graph-emoji">${p.emoji}</text>
          <circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#ffffff" stroke="#ffd166" stroke-width="2.5" />
          <text x="${p.x}" y="${p.y - 8}" class="graph-temp-label">${p.temp}°C</text>
        `;
      });

      svg.innerHTML = svgContent;
    }

    function showOfflineState() {
      document.getElementById('offlineModal').classList.add('active');
      document.getElementById('skeletonLoader').classList.remove('active');
    }

    function hideOfflineState() {
      document.getElementById('offlineModal').classList.remove('active');
    }

    function retryConnection() {
      if (navigator.onLine) {
        hideOfflineState();
        getWeatherData(32.5742, 74.0754, "Gujrat, PK");
      }
    }

    window.addEventListener('offline', showOfflineState);
    window.addEventListener('online', hideOfflineState);

    async function getWeatherData(lat, lon, cityName) {
      if (!navigator.onLine) {
        showOfflineState();
        return;
      }

      document.getElementById('skeletonLoader').classList.add('active');
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
        
        if (!res.ok) throw new Error("Network Error");

        const data = await res.json();
        const current = data.current_weather;
        const info = getWeatherDetails(current.weathercode);

        document.body.style.backgroundImage = info.bg;

        document.getElementById('cityName').textContent = cityName;
        document.getElementById('tempDegree').textContent = `${Math.round(current.temperature)}°C`;
        document.getElementById('weatherDesc').textContent = info.desc;
        document.getElementById('weatherEmoji').textContent = info.emoji;
        document.getElementById('windVal').textContent = `${current.windspeed} km/h`;
        document.getElementById('humidityVal').textContent = `52%`;
        document.getElementById('pressureVal').textContent = `1012 hPa`;

        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const graphData = [];

        for (let i = 0; i < 7; i++) {
          const dateObj = new Date(data.daily.time[i]);
          const dayName = i === 0 ? 'Today' : days[dateObj.getDay()];
          const fInfo = getWeatherDetails(data.daily.weathercode[i]);
          const max = Math.round(data.daily.temperature_2m_max[i]);

          graphData.push({
            day: dayName,
            maxTemp: max,
            emoji: fInfo.emoji
          });
        }

        renderLineGraph(graphData);
        hideOfflineState();
      } catch (err) {
        showOfflineState();
      } finally {
        document.getElementById('skeletonLoader').classList.remove('active');
      }
    }

    async function fetchWeatherBySearch() {
      const city = document.getElementById('cityInput').value.trim();
      if (!city) return;
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        const d = await res.json();
        if (d.results && d.results.length > 0) {
          const loc = d.results[0];
          getWeatherData(loc.latitude, loc.longitude, `${loc.name}, ${loc.country_code ? loc.country_code.toUpperCase() : ''}`);
        } else {
          alert("City not found.");
        }
      } catch (e) {
        showOfflineState();
      }
    }

    function fetchWeatherByLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          getWeatherData(pos.coords.latitude, pos.coords.longitude, "Your Location");
        }, () => getWeatherData(32.5742, 74.0754, "Gujrat, PK"));
      } else {
        getWeatherData(32.5742, 74.0754, "Gujrat, PK");
      }
    }

    document.getElementById('cityInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') fetchWeatherBySearch();
    });

    getWeatherData(32.5742, 74.0754, "Gujrat, PK");
  </script>
</body>
</html>
